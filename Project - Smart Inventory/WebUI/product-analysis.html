<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Product Analysis</title>

    <link rel="stylesheet"
          href="product-analysis.css">

</head>

<body>

    <div class="analysis-page">

        <!-- =================================================
             HEADER
        ================================================== -->

        <div class="analysis-header">

            <div>

                <h1>Product Analysis</h1>

                <p>
                    Analyze product sales and inventory performance
                </p>

            </div>

            <button id="refreshAnalysis"
                    class="refresh-btn">
                ↻ Refresh
            </button>

        </div>


        <!-- =================================================
             SUMMARY CARDS
        ================================================== -->

        <div class="summary-grid">

            <div class="summary-card">

                <div class="summary-label">
                    Total Products
                </div>

                <div id="totalProducts"
                     class="summary-value">
                    0
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-label">
                    Products Sold
                </div>

                <div id="productsSold"
                     class="summary-value">
                    0
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-label">
                    Total Units Sold
                </div>

                <div id="totalUnitsSold"
                     class="summary-value">
                    0
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-label">
                    Total Sales
                </div>

                <div id="totalSales"
                     class="summary-value">
                    ₹0.00
                </div>

            </div>

        </div>


        <!-- =================================================
             SEARCH / FILTER
        ================================================== -->

        <div class="analysis-toolbar">

            <input type="text"
                   id="analysisSearch"
                   placeholder="Search product...">


            <select id="performanceFilter">

                <option value="all">
                    All Products
                </option>

                <option value="top">
                    Top Performing
                </option>

                <option value="medium">
                    Medium Performing
                </option>

                <option value="low">
                    Low Performing
                </option>

                <option value="never">
                    No Sales
                </option>

            </select>

        </div>


        <!-- =================================================
             PRODUCT ANALYSIS TABLE
        ================================================== -->

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>Product Code</th>

                        <th>Product Name</th>

                        <th>Category</th>

                        <th>Current Stock</th>

                        <th>Units Sold</th>

                        <th>Selling Price</th>

                        <th>Total Sales</th>

                        <th>Performance</th>

                    </tr>

                </thead>


                <tbody id="analysisTableBody">

                    <tr>

                        <td colspan="8"
                            class="empty-message">
                            Loading product analysis...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>


    <script src="product-analysis.js"></script>

</body>

</html>
