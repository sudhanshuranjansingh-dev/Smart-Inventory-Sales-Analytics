
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#1769ff">
    <meta name="description" content="Sales Nova - Manage sales and track inventory.">

    <title>Sales - Sales Nova</title>

    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="sales.css">
</head>

<body>

    <div class="sales-container">

        <!-- PAGE HEADER -->
        <header class="page-header">
            <div>
                <h1>Sales</h1>
         
            </div>
        </header>

        <!-- MESSAGE -->
        <div id="message"
             class="message"
             role="status"
             aria-live="polite">
        </div>

        <!-- NEW SALE -->
        <section class="card" aria-labelledby="newSaleHeading">

            <div class="card-header">
                <div>
                    <h2 id="newSaleHeading">New Sale</h2>
                    <p>Enter customer details, select a product and enter the quantity.</p>
                </div>
            </div>

            <form id="saleForm">

                <div class="form-grid">

                    <!-- CUSTOMER NAME -->
                    <div class="form-group">
                        <label for="customerName">Customer Name</label>
                        <input
                            type="text"
                            id="customerName"
                            name="customerName"
                            placeholder="Enter customer name"
                            maxlength="100"
                            autocomplete="name"
                            required>
                    </div>

                    <!-- CUSTOMER PHONE -->
                    <div class="form-group">
                        <label for="customerPhone">Customer Phone Number</label>
                        <input
                            type="tel"
                            id="customerPhone"
                            name="customerPhone"
                            placeholder="Enter 10-digit phone number"
                            maxlength="10"
                            inputmode="numeric"
                            pattern="[0-9]{10}"
                            autocomplete="tel-national"
                            required>
                    </div>

                    <!-- PRODUCT -->
                    <div class="form-group">
                        <label for="product">Product</label>
                        <select id="product" name="product" required>
                            <option value="">Select Product</option>
                        </select>
                    </div>

                    <!-- QUANTITY -->
                    <div class="form-group">
                        <label for="quantity">Quantity</label>
                        <input
                            type="number"
                            id="quantity"
                            name="quantity"
                            min="1"
                            step="1"
                            value="1"
                            required>
                    </div>

                    <!-- SELLING PRICE -->
                    <div class="form-group">
                        <label for="sellingPrice">Selling Price</label>
                        <input
                            type="number"
                            id="sellingPrice"
                            name="sellingPrice"
                            step="0.01"
                            min="0"
                            placeholder="0.00"
                            readonly>
                    </div>

                    <!-- AVAILABLE STOCK -->
                    <div class="form-group">
                        <label for="availableStock">Available Stock</label>
                        <input
                            type="number"
                            id="availableStock"
                            name="availableStock"
                            min="0"
                            placeholder="0"
                            readonly>
                    </div>

                </div>

                <!-- TOTAL -->
                <div class="total-section">
                    <span>Total Amount</span>
                    <strong id="totalAmount">₹0.00</strong>
                </div>

                <!-- ACTIONS -->
                <div class="form-actions">

                    <button
                        type="reset"
                        id="btnClear"
                        class="secondary-btn">
                        Clear
                    </button>

                    <button
                        type="submit"
                        class="primary-btn">
                        Complete Sale
                    </button>

                </div>

            </form>

        </section>

        <!-- RECENT SALES -->
        <section class="card" aria-labelledby="recentSalesHeading">

            <div class="card-header">
                <div>
                    <h2 id="recentSalesHeading">Recent Sales</h2>
                    <p>Latest sales transactions.</p>
                </div>

                <div id="salesCount" class="count-badge">
                    0 Sales
                </div>
            </div>

            <div class="table-container">

                <table id="salesTable">

                    <thead>
                        <tr>
                            <th scope="col">S.No</th>
                            <th scope="col">Product Code</th>
                            <th scope="col">Product</th>
                            <th scope="col">Customer Name</th>
                            <th scope="col">Customer Phone</th>
                            <th scope="col">Quantity</th>
                            <th scope="col">Selling Price</th>
                            <th scope="col">Total Amount</th>
                            <th scope="col">Date &amp; Time</th>
                        </tr>
                    </thead>

                    <tbody id="salesTableBody">
                        <tr>
                            <td colspan="9" class="empty-state">
                                No sales found.
                            </td>
                        </tr>
                    </tbody>

                </table>

            </div>

        </section>

    </div>

    <!-- SALES LOGIC -->
    <script src="sales.js"></script>

</body>
</html>
