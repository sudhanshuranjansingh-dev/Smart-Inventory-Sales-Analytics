<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sales</title>

    <link rel="stylesheet" href="sales.css">
</head>

<body>

    <div class="sales-container">

        <!-- PAGE HEADER -->
        <div class="page-header">

            <div>
                <h1>Sales</h1>
                <p>Create sales transactions and manage sold products</p>
            </div>

        </div>


        <!-- MESSAGE -->
        <div id="message" class="message"></div>


        <!-- NEW SALE -->
        <div class="card">

            <div class="card-header">
                <div>
                    <h2>New Sale</h2>
                    <p>Select a product and enter the quantity</p>
                </div>
            </div>


            <form id="saleForm">

                <div class="form-grid">

                    <!-- PRODUCT -->
                    <div class="form-group">

                        <label for="product">
                            Product
                        </label>

                        <select id="product" required>

                            <option value="">
                                Select Product
                            </option>

                        </select>

                    </div>


                    <!-- QUANTITY -->
                    <div class="form-group">

                        <label for="quantity">
                            Quantity
                        </label>

                        <input type="number"
                               id="quantity"
                               min="1"
                               value="1"
                               required>

                    </div>


                    <!-- SELLING PRICE -->
                    <div class="form-group">

                        <label for="sellingPrice">
                            Selling Price
                        </label>

                        <input type="number"
                               id="sellingPrice"
                               step="0.01"
                               readonly>

                    </div>


                    <!-- AVAILABLE STOCK -->
                    <div class="form-group">

                        <label for="availableStock">
                            Available Stock
                        </label>

                        <input type="number"
                               id="availableStock"
                               readonly>

                    </div>

                </div>


                <!-- TOTAL -->
                <div class="total-section">

                    <span>Total Amount</span>

                    <strong id="totalAmount">
                        ₹0.00
                    </strong>

                </div>


                <!-- ACTIONS -->
                <div class="form-actions">

                    <button type="reset"
                            id="btnClear"
                            class="secondary-btn">

                        Clear

                    </button>

                    <button type="submit"
                            class="primary-btn">

                        Complete Sale

                    </button>

                </div>

            </form>

        </div>


        <!-- RECENT SALES -->
        <div class="card">

            <div class="card-header">

                <div>
                    <h2>Recent Sales</h2>
                    <p>Latest sales transactions</p>
                </div>

                <div id="salesCount"
                     class="count-badge">

                    0 Sales

                </div>

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>Sale ID</th>

                            <th>Product</th>

                            <th>Quantity</th>

                            <th>Selling Price</th>

                            <th>Total Amount</th>

                            <th>Date</th>

                        </tr>

                    </thead>


                    <tbody id="salesTableBody">

                        <tr>

                            <td colspan="6"
                                class="empty-state">

                                No sales found.

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <script src="sales.js"></script>

</body>

</html>
