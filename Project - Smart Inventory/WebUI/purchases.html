<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Purchases - Smart Inventory</title>

    <link rel="stylesheet"
          href="purchases.css">
</head>

<body>

    <div class="page-container">

        <!-- =================================================
             PAGE HEADER
        ================================================== -->

        <div class="page-header">

            <div>
                <h1>Purchases</h1>

                <p>
                    Manage purchases and increase inventory stock.
                </p>
            </div>

        </div>


        <!-- =================================================
             PURCHASE FORM
        ================================================== -->

        <section class="card">

            <div class="card-header">

                <div>
                    <h2>Add Purchase</h2>

                    <p>
                        Record a new purchase from a supplier.
                    </p>
                </div>

            </div>


            <form id="purchaseForm">

                <div class="form-grid">

                    <!-- Supplier -->

                    <div class="form-group">

                        <label for="supplierSelect">
                            Supplier
                        </label>

                        <select id="supplierSelect"
                                required>

                            <option value="">
                                Select Supplier
                            </option>

                        </select>

                    </div>


                    <!-- Product -->

                    <div class="form-group">

                        <label for="productSelect">
                            Product
                        </label>

                        <select id="productSelect"
                                required>

                            <option value="">
                                Select Product
                            </option>

                        </select>

                    </div>


                    <!-- Quantity -->

                    <div class="form-group">

                        <label for="quantity">
                            Quantity
                        </label>

                        <input type="number"
                               id="quantity"
                               min="1"
                               step="1"
                               placeholder="Enter quantity"
                               required>

                    </div>


                    <!-- Purchase Price -->

                    <div class="form-group">

                        <label for="purchasePrice">
                            Purchase Price
                        </label>

                        <input type="number"
                               id="purchasePrice"
                               min="0.01"
                               step="0.01"
                               placeholder="Enter purchase price"
                               required>

                    </div>

                </div>


                <!-- =================================================
                     PURCHASE SUMMARY
                ================================================== -->

                <div class="purchase-summary">

                    <div class="summary-item">

                        <span>Current Stock</span>

                        <strong id="currentStock">
                            0
                        </strong>

                    </div>


                    <div class="summary-item">

                        <span>Purchase Quantity</span>

                        <strong id="summaryQuantity">
                            0
                        </strong>

                    </div>


                    <div class="summary-item">

                        <span>New Stock</span>

                        <strong id="newStock">
                            0
                        </strong>

                    </div>


                    <div class="summary-item total">

                        <span>Total Amount</span>

                        <strong id="totalAmount">
                            ₹0.00
                        </strong>

                    </div>

                </div>


                <!-- =================================================
                     FORM ACTIONS
                ================================================== -->

                <div class="form-actions">

                    <button type="button"
                            id="clearPurchaseBtn"
                            class="btn secondary">

                        Clear

                    </button>


                    <button type="submit"
                            class="btn primary">

                        Add Purchase

                    </button>

                </div>

            </form>

        </section>


        <!-- =================================================
             PURCHASE HISTORY
        ================================================== -->

        <section class="card">

            <div class="card-header">

                <div>

                    <h2>Purchase History</h2>

                    <p>
                        Recently recorded purchases.
                    </p>

                </div>

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>Purchase ID</th>

                            <th>Supplier</th>

                            <th>Date</th>

                            <th>Total Amount</th>

                        </tr>

                    </thead>


                    <tbody id="purchasesTableBody">

                        <tr>

                            <td colspan="4"
                                class="empty-state">

                                Loading purchases...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </div>


    <script src="purchases.js"></script>

</body>

</html>
