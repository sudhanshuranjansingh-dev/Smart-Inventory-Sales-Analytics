
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Approval | Smart Inventory</title>

    <!-- Shared application styles -->
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="admin-approval.css">
</head>

<body>

    <main class="page-container">

        <!-- PAGE HEADER -->
        <header class="page-header">
            <div>
                <h1>Admin Approval</h1>
            </div>

            <button type="button"
                    id="refreshApprovalsBtn"
                    class="btn btn-primary">
                Refresh Requests
            </button>
        </header>

        <!-- INFORMATION CARD -->
        <section class="info-card">
            
           
        </section>

        <!-- APPROVAL TABLE -->
        <section class="table-card">

            <div class="table-header">
                <div>
                    <h2>Registration Requests</h2>
                </div>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">User ID</th>
                            <th scope="col">Username</th>
                            <th scope="col">Full Name</th>
                            <th scope="col">Role</th>
                            <th scope="col">Status</th>
                            <th scope="col">Requested</th>
                            <th scope="col">Action</th>
                        </tr>
                    </thead>

                    <tbody id="approvalTableBody">
                        <tr>
                            <td colspan="7" class="empty-message">
                                Loading requests...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </section>

        <!-- STATUS AND ERROR MESSAGES -->
        <p id="message"
           role="status"
           aria-live="polite">
        </p>

    </main>

    <!-- Page JavaScript -->
    <script src="admin-approval.js"></script>

    <!-- Refresh button handler -->
    <script>
                document.addEventListener("DOMContentLoaded", function () {
                    const refreshButton =
                        document.getElementById("refreshApprovalsBtn");

                    if (refreshButton) {
                        refreshButton.addEventListener("click", function () {
                            window.postMessage(
                                { action: "loadPendingAdmins" },
                                "*"
                            );
                        });
                    }
                });
    </script>

</body>
</html>
