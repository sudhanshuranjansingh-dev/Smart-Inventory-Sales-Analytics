
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reports</title>

    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="reports.css">
</head>

<body>
    <div class="reports-container">

        <!-- Page Header -->
        <header class="page-header">
            <div>
                <h1>Reports</h1>
                <p></p>
            </div>

            <div class="header-actions">
                <button id="printBtn" class="btn btn-primary" type="button">
                    🖨 Print
                </button>
            </div>
        </header>

        <!-- Report Controls -->
        <section class="report-controls">
            <div class="control-group">
                <label for="reportType">Report Type</label>
                <select id="reportType">
                    <option value="sales">Sales Report</option>
                    <option value="inventory">Inventory Report</option>
                    <option value="low-stock">Low Stock Report</option>
                    <option value="product-performance">Product Performance</option>
                </select>
            </div>

            <div id="dateControls" class="date-controls">
                <div class="control-group">
                    <label for="fromDate">From Date</label>
                    <input type="date" id="fromDate">
                </div>

                <div class="control-group">
                    <label for="toDate">To Date</label>
                    <input type="date" id="toDate">
                </div>
            </div>

            <div class="control-group search-group">
                <label for="searchInput">Search</label>
                <input type="text"
                       id="searchInput"
                       placeholder="Search report...">
            </div>

            <div class="control-group generate-group">
                <label for="generateBtn">&nbsp;</label>
                <button id="generateBtn" class="btn btn-primary" type="button">
                    Generate Report
                </button>
            </div>
        </section>

        <!-- Report Heading -->
        <section class="report-heading">
            <div>
                <h2 id="reportTitle">Sales Report</h2>
            </div>
        </section>

        <!-- Report Table -->
        <div class="table-container">
            <table id="reportTable">
                <thead id="reportTableHead">
                    <tr>
                        <th scope="col">S.No</th>
                        <th scope="col">Product</th>
                        <th scope="col">Quantity</th>
                        <th scope="col">Selling Price</th>
                        <th scope="col">Total</th>
                        <th scope="col">Date</th>
                    </tr>
                </thead>

                <tbody id="reportTableBody">
                    <!-- Report rows are generated by reports.js -->
                </tbody>
            </table>
        </div>

        <!-- Report Status -->
        <div id="reportStatus" class="report-status" role="status">
            Ready to generate report.
        </div>

    </div>

    <script src="reports.js"></script>
</body>
</html>
