< !DOCTYPE html >
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Inventory</title>

    <link rel="stylesheet"
          href="inventory.css">

</head>


<body>

    <div class="inventory-page">

        <!-- =================================================
                            HEADER
        ================================================== -->

        <div class="inventory-header">

            <div>

                <h1>Inventory</h1>

                <p>
                    Monitor your current stock levels
                </p>

            </div>


            <button id="refreshInventory"
                    class="refresh-btn">
                ↻ Refresh
            </button>

        </div>


        <!-- =================================================
                            SUMMARY CARDS
        ================================================== -->

        <div class="summary-grid">

            <div class="summary-card">

                <div class="summary-label">
                    Total Products
                </div>

                <div id="totalProducts"
                     class="summary-value">
                    0
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-label">
                    Total Stock
                </div>

                <div id="totalStock"
                     class="summary-value">
                    0
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-label">
                    Low Stock
                </div>

                <div id="lowStock"
                     class="summary-value warning">
                    0
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-label">
                    Out of Stock
                </div>

                <div id="outOfStock"
                     class="summary-value danger">
                    0
                </div>

            </div>

        </div>


        <!-- =================================================
                            SEARCH / FILTER
        ================================================== -->

        <div class="inventory-toolbar">

            <input type="text"
                   id="inventorySearch"
                   placeholder="Search product...">


            <select id="stockFilter">

                <option value="all">
                    All Stock
                </option>

                <option value="in-stock">
                    In Stock
                </option>

                <option value="low-stock">
                    Low Stock
                </option>

                <option value="out-of-stock">
                    Out of Stock
                </option>

            </select>

        </div>


        <!-- =================================================
                            INVENTORY TABLE
        ================================================== -->

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>Product Code</th>

                        <th>Product Name</th>

                        <th>Category</th>

                        <th>Current Stock</th>

                        <th>Minimum Stock</th>

                        <th>Status</th>

                        <th>Purchase Price</th>

                        <th>Selling Price</th>

                    </tr>

                </thead>


                <tbody id="inventoryTableBody">

                    <tr>

                        <td colspan="8"
                            class="empty-message">
                            Loading inventory...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>


    <script src="inventory.js"></script>

</body>

</html>
