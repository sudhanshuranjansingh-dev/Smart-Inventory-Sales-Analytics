<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suppliers</title>

    <link rel="stylesheet" href="suppliers.css">
</head>

<body>

    <div class="suppliers-container">

        <!-- HEADER -->
        <div class="page-header">
            <div>
                <h1>Suppliers</h1>
                <p>Manage your suppliers and supplier information</p>
            </div>

            <button id="btnAddSupplier" class="primary-btn">
                + Add Supplier
            </button>
        </div>


        <!-- MESSAGE -->
        <div id="message" class="message"></div>


        <!-- ADD SUPPLIER FORM -->
        <div id="supplierFormCard" class="card form-card hidden">

            <div class="card-header">
                <h2>Add Supplier</h2>
                <button id="btnCloseForm" class="close-btn">×</button>
            </div>

            <form id="supplierForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="supplierName">Supplier Name</label>
                        <input type="text"
                               id="supplierName"
                               placeholder="Enter supplier name"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="text"
                               id="phone"
                               placeholder="Enter phone number">
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email"
                               id="email"
                               placeholder="Enter email address">
                    </div>

                    <div class="form-group">
                        <label for="address">Address</label>
                        <input type="text"
                               id="address"
                               placeholder="Enter supplier address">
                    </div>

                </div>

                <div class="form-actions">

                    <button type="button" id="btnCancel" class="secondary-btn">
                        Cancel
                    </button>

                    <button type="submit" class="primary-btn">
                        Save Supplier
                    </button>

                </div>

            </form>

        </div>


        <!-- SUPPLIER LIST -->
        <div class="card">

            <div class="card-header">
                <div>
                    <h2>Supplier List</h2>
                    <p>All registered suppliers</p>
                </div>

                <div id="supplierCount" class="count-badge">
                    0 Suppliers
                </div>
            </div>


            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Supplier Name</th>
                            <th>Phone</th>
                            <th>Email</th>
                            <th>Address</th>
                        </tr>
                    </thead>

                    <tbody id="supplierTableBody">

                        <tr>
                            <td colspan="5" class="empty-state">
                                No suppliers found.
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <script src="suppliers.js"></script>

</body>

</html>
