
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#1769ff">
    <meta name="description" content="Sales Nova - Smarter Inventory. Better Sales.">

    <title>Sales Nova - Login</title>

    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="login.css">

    <style>
        /* Hide the empty error box when the login page opens */
        #message.login-message:empty {
            display: none !important;
            visibility: hidden !important;
            height: 0 !important;
            min-height: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            border: 0 !important;
            box-shadow: none !important;
        }

        /* Display the message box only when it contains text */
        #message.login-message:not(:empty) {
            display: flex;
            visibility: visible;
            height: auto;
            margin-top: 13px;
        }
    </style>
</head>

<body>

    <main class="login-container">

        <section class="login-card" aria-labelledby="login-title">

            <!-- SALES NOVA BRANDING -->
            <header class="login-header">

                <div class="login-logo">
                    <svg viewBox="0 0 64 64"
                         xmlns="http://www.w3.org/2000/svg"
                         role="img"
                         aria-label="Sales Nova logo">

                        <rect x="2" y="2"
                              width="60" height="60"
                              rx="16"
                              fill="#e8f2ff" />

                        <rect x="13" y="37"
                              width="8" height="14"
                              rx="2"
                              fill="#123b7a" />

                        <rect x="27" y="28"
                              width="8" height="23"
                              rx="2"
                              fill="#1769ff" />

                        <rect x="41" y="19"
                              width="8" height="32"
                              rx="2"
                              fill="#1769ff" />

                        <path d="M10 31 L25 23 L36 27 L51 12"
                              fill="none"
                              stroke="#123b7a"
                              stroke-width="4"
                              stroke-linecap="round"
                              stroke-linejoin="round" />

                        <path d="M39 12 H51 V24"
                              fill="none"
                              stroke="#1769ff"
                              stroke-width="4"
                              stroke-linecap="round"
                              stroke-linejoin="round" />
                    </svg>
                </div>

                <h1 id="login-title">
                    <span class="brand-sales">Sales</span>
                    <span class="brand-nova">Nova</span>
                </h1>

                <p class="brand-tagline">
                    SMARTER INVENTORY. BETTER SALES.
                </p>

                <p class="login-subtitle">
                    Sign in to your account
                </p>

            </header>

            <!-- LOGIN FORM -->
            <form class="login-form"
                  id="loginForm"
                  onsubmit="return false;">

                <!-- USERNAME -->
                <div class="form-group">

                    <label for="username">Username</label>

                    <div class="input-wrapper">

                        <svg class="input-icon"
                             viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="1.8"
                             aria-hidden="true">

                            <circle cx="12" cy="8" r="4" />
                            <path d="M4 21v-2a8 8 0 0 1 16 0v2z" />
                        </svg>

                        <input type="text"
                               id="username"
                               name="username"
                               placeholder="Enter your username"
                               autocomplete="username"
                               required>
                    </div>
                </div>

                <!-- PASSWORD -->
                <div class="form-group">

                    <label for="password">Password</label>

                    <div class="input-wrapper">

                        <svg class="input-icon"
                             viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="1.8"
                             aria-hidden="true">

                            <rect x="4" y="10"
                                  width="16" height="11"
                                  rx="2" />

                            <path d="M8 10V7a4 4 0 0 1 8 0v3" />
                            <circle cx="12" cy="15" r="1" />
                            <path d="M12 16v2" />
                        </svg>

                        <input type="password"
                               id="password"
                               name="password"
                               placeholder="Enter your password"
                               autocomplete="current-password"
                               required>

                        <button type="button"
                                id="togglePassword"
                                class="password-toggle"
                                aria-label="Show password"
                                title="Show password">

                            <svg viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="1.8"
                                 aria-hidden="true">

                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>

                        </button>
                    </div>
                </div>

                <!-- LOGIN BUTTON -->
                <button type="button"
                        id="btnLogin"
                        class="login-button">

                    <span>Sign In</span>

                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         aria-hidden="true">

                        <path d="M5 12h14" />
                        <path d="m12 5 7 7-7 7" />
                    </svg>
                </button>

                <!-- STATUS / ERROR MESSAGE -->
                <div id="message"
                     class="login-message"
                     role="status"
                     aria-live="polite"></div>

            </form>

            <!-- REGISTER LINK -->
            <div class="register-section">

                <span>New to Sales Nova?</span>

                <a href="#"
                   id="btnRegister"
                   onclick="return false;">
                    Create an account
                </a>

            </div>

            <!-- EXIT BUTTON -->
            <button type="button"
                    id="btnExit"
                    class="exit-button">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     aria-hidden="true">

                    <path d="M10 17l5-5-5-5" />
                    <path d="M15 12H3" />
                    <path d="M12 3h6a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3h-6" />
                </svg>

                <span>Exit</span>
            </button>

            <!-- FOOTER BRANDING -->
            <footer 
                   class="login-footer">
            </footer>

        </section>

    </main>

    <!-- PASSWORD VISIBILITY -->
    <script>
                document.addEventListener("DOMContentLoaded", function () {

                    const passwordInput =
                        document.getElementById("password");

                    const toggleButton =
                        document.getElementById("togglePassword");

                    if (!passwordInput || !toggleButton) {
                        return;
                    }

                    toggleButton.addEventListener("click", function () {

                        const isPasswordHidden =
                            passwordInput.getAttribute("type") === "password";

                        passwordInput.setAttribute(
                            "type",
                            isPasswordHidden ? "text" : "password"
                        );

                        toggleButton.setAttribute(
                            "aria-label",
                            isPasswordHidden ? "Hide password" : "Show password"
                        );

                        toggleButton.setAttribute(
                            "title",
                            isPasswordHidden ? "Hide password" : "Show password"
                        );
                    });
                });
    </script>

    <!-- EXISTING LOGIN FUNCTIONALITY -->
    <script src="login.js"></script>

</body>
</html>
