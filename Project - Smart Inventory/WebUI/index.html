<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">

	<meta name="viewport"
		  content="width=device-width, initial-scale=1.0">

	<title>Smart Inventory</title>

	<link rel="stylesheet"
		  href="main.css">

</head>


<body>

	<div class="app">


		<!-- =====================================================
			 SIDEBAR
		====================================================== -->

		<aside class="sidebar">


			<!-- ================= BRAND ================= -->

			<div class="brand">

				<div class="brand-logo">
					📦
				</div>

				<div>

					<div class="brand-name">
						Smart
					</div>

					<div class="brand-subtitle">
						INVENTORY
					</div>

				</div>

			</div>


			<!-- ================= NAVIGATION ================= -->

			<nav class="navigation">


				<!-- ================= MAIN ================= -->

				<div class="section-title">
					MAIN
				</div>


				<button class="nav-item active"
						onclick="navigate('dashboard')">

					<span>⌂</span>

					<label>
						Dashboard
					</label>

				</button>


				<!-- ================= INVENTORY ================= -->

				<div class="section-title">
					INVENTORY
				</div>


				<button class="nav-item"
						onclick="navigate('products')">

					<span>▣</span>

					<label>
						Products
					</label>

				</button>


				<button class="nav-item"
						onclick="navigate('categories')">

					<span>▦</span>

					<label>
						Categories
					</label>

				</button>


				<button class="nav-item"
						onclick="navigate('suppliers')">

					<span>♙</span>

					<label>
						Suppliers
					</label>

				</button>


				<!-- ================= TRANSACTIONS ================= -->

				<div class="section-title">
					TRANSACTIONS
				</div>


				<button class="nav-item"
						onclick="navigate('purchases')">

					<span>🛒</span>

					<label>
						Purchases
					</label>

				</button>


				<button class="nav-item"
						onclick="navigate('sales')">

					<span>₹</span>

					<label>
						Sales
					</label>

				</button>


				<button class="nav-item"
						onclick="navigate('sales-history')">

					<span>☷</span>

					<label>
						Sales History
					</label>

				</button>


				<!-- ================= ANALYTICS ================= -->

				<div class="section-title">
					ANALYTICS
				</div>


				<button class="nav-item"
						onclick="navigate('inventory')">

					<span>▤</span>

					<label>
						Inventory
					</label>

				</button>


				<button class="nav-item"
						onclick="navigate('product-analysis')">

					<span>◈</span>

					<label>
						Product Analysis
					</label>

				</button>


				<button class="nav-item"
						onclick="navigate('sales-analytics')">

					<span>◉</span>

					<label>
						Sales Analytics
					</label>

				</button>


				<!-- ================= REPORTING ================= -->

				<div class="section-title">
					REPORTING
				</div>


				<button class="nav-item"
						onclick="navigate('reports')">

					<span>▤</span>

					<label>
						Reports
					</label>

				</button>


				<!-- ================= ADMINISTRATION ================= -->

				<div class="section-title">
					ADMINISTRATION
				</div>


				<button class="nav-item"
						id="btnAdminApproval"
						onclick="navigate('admin-approval')">

					<span>♟</span>

					<label>
						Admin Approval
					</label>

				</button>


			</nav>


			<!-- =================================================
				 SIDEBAR BOTTOM
			================================================== -->

			<div class="sidebar-bottom">

				<button class="nav-item"
						onclick="logout()">

					<span>↪</span>

					<label>
						Logout
					</label>

				</button>

			</div>


		</aside>



		<!-- =====================================================
			 MAIN CONTENT
		====================================================== -->

		<main class="main">


			<!-- ================= TOPBAR ================= -->

			<header class="topbar">


				<!-- PAGE INFORMATION -->

				<div class="page-heading">

					<h1 id="page-title">
						Dashboard
					</h1>

					<p id="page-subtitle">
						Overview of your inventory and sales
					</p>

				</div>



				<!-- ================= TOPBAR RIGHT ================= -->

				<div class="topbar-right">


					<!-- NOTIFICATION -->

					<button class="notification"
							type="button"
							title="Notifications">

						🔔

					</button>



					<!-- ================= USER ================= -->

					<div class="user">


						<!-- USER AVATAR -->

						<div class="avatar"
							 id="user-avatar">

							U

						</div>



						<!-- USER DETAILS -->

						<div class="user-details">


							<!-- USERNAME -->

							<strong id="username">
								User
							</strong>


							<!-- ROLE -->

							<small id="user-role">
								User
							</small>


						</div>


					</div>


				</div>


			</header>



			<!-- =================================================
				 PAGE CONTENT
			================================================== -->

			<section class="content">


				<iframe id="page-frame"
						src="dashboard.html"
						title="Smart Inventory Content">
				</iframe>


			</section>


		</main>


	</div>



	<!-- =========================================================
		 MAIN JAVASCRIPT
	========================================================== -->

	<script src="main.js"></script>


</body>

</html>
