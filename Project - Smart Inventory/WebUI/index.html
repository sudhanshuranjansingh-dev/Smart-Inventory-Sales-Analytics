
<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Smart Inventory</title>
	<link rel="stylesheet" href="theme.css">
	<link rel="stylesheet" href="main.css">
</head>

<body>

	<div class="app">

		<!-- SIDEBAR -->
		<aside class="sidebar">

			<!-- BRAND -->
			<div class="brand">
				<div class="brand-logo">📦</div>

				<div class="brand-text">
					<div class="brand-name">Smart</div>
					<div class="brand-subtitle">INVENTORY</div>
				</div>
			</div>

			<!-- NAVIGATION -->
			<nav class="navigation">

				<div class="section-title">MAIN</div>

				<button class="nav-item active" type="button"
						onclick="navigate('dashboard')">
					<span class="nav-icon">⌂</span>
					<span>Dashboard</span>
				</button>

				<div class="section-title">INVENTORY</div>

				<button class="nav-item" type="button"
						onclick="navigate('products')">
					<span class="nav-icon">▣</span>
					<span>Products</span>
				</button>

				<button class="nav-item" type="button"
						onclick="navigate('categories')">
					<span class="nav-icon">▦</span>
					<span>Categories</span>
				</button>

				<button class="nav-item" type="button"
						onclick="navigate('suppliers')">
					<span class="nav-icon">♙</span>
					<span>Suppliers</span>
				</button>

				<div class="section-title">TRANSACTIONS</div>

				<button class="nav-item" type="button"
						onclick="navigate('purchases')">
					<span class="nav-icon">🛒</span>
					<span>Purchases</span>
				</button>

				<button class="nav-item" type="button"
						onclick="navigate('sales')">
					<span class="nav-icon">₹</span>
					<span>Sales</span>
				</button>

				<button class="nav-item" type="button"
						onclick="navigate('sales-history')">
					<span class="nav-icon">☷</span>
					<span>Sales History</span>
				</button>

				<div class="section-title">ANALYTICS</div>

				<button class="nav-item" type="button"
						onclick="navigate('inventory')">
					<span class="nav-icon">▤</span>
					<span>Inventory</span>
				</button>

				<button class="nav-item" type="button"
						onclick="navigate('product-analysis')">
					<span class="nav-icon">◈</span>
					<span>Product Analysis</span>
				</button>

				<button class="nav-item" type="button"
						onclick="navigate('sales-analytics')">
					<span class="nav-icon">◉</span>
					<span>Sales Analytics</span>
				</button>

				<div class="section-title">REPORTING</div>

				<button class="nav-item" type="button"
						onclick="navigate('reports')">
					<span class="nav-icon">▤</span>
					<span>Reports</span>
				</button>

				<div class="section-title">ADMINISTRATION</div>

				<button class="nav-item" id="btnAdminApproval"
						type="button"
						onclick="navigate('admin-approval')">
					<span class="nav-icon">♟</span>
					<span>Admin Approval</span>
				</button>

			</nav>

			<!-- SIDEBAR BOTTOM -->
			<div class="sidebar-bottom">

				<button class="nav-item" type="button"
						onclick="logout()">
					<span class="nav-icon">↪</span>
					<span>Logout</span>
				</button>

			</div>

		</aside>

		<!-- MAIN APPLICATION -->
		<main class="main">

			<!-- TOPBAR -->
			<header class="topbar">

				<div class="page-heading">
					<h1 id="page-title">Dashboard</h1>
					<p id="page-subtitle">
						Overview of your inventory and sales
					</p>
				</div>

				<!-- USER PROFILE -->
				<div class="topbar-right">

					<div class="user" id="user-profile">

						<div class="avatar" id="user-avatar">U</div>

						<div class="user-details">
							<strong id="username">User</strong>
							<small id="user-role">User</small>
						</div>

					</div>

				</div>

			</header>

			<!-- PAGE CONTENT -->
			<section class="content">

				<iframe id="page-frame"
						src="dashboard.html"
						title="Smart Inventory Content">
				</iframe>

			</section>

		</main>

	</div>

	<!-- APPLICATION JAVASCRIPT -->
	<script src="main.js"></script>

</body>
</html>
